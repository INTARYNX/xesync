# =====================================================================
# Local xesync stack — PostgreSQL 16 + PostgREST 12.2.3, pinned to the
# exact versions running in production (see dev/postgresql.md).
#
# Brings up a disposable copy of the real schema so pgsql/xesync_schema.sql
# and pgsql/migrate.sh's approach (reapply the whole idempotent file) can be
# exercised against a real database before touching the production one, and
# so Playwright's DB-integration spec has something to talk to.
#
# Usage (from repo root):
#   podman compose -f dev/docker-compose.yml up -d
#   podman compose -f dev/docker-compose.yml down -v   # -v wipes the data volume
#
# PostgREST:  http://localhost:${DEV_POSTGREST_PORT:-3001}
# Postgres:   localhost:${DEV_PG_PORT:-5433}  (postgres / postgres, db xesync)
#
# Ports default to 5433/3001, not 5432/3000, so this can run alongside
# another local Postgres/PostgREST without a collision.
# =====================================================================

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: xesync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DEV_PG_PORT:-5433}:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ../pgsql/xesync_schema.sql:/docker-entrypoint-initdb.d/50-xesync_schema.sql:ro
      - xesync-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xesync"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgrest:
    image: docker.io/postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://xesync:xesync_dev_pw@db:5432/xesync
      PGRST_DB_SCHEMAS: xesync
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
    ports:
      - "${DEV_POSTGREST_PORT:-3001}:3000"

volumes:
  xesync-dev-pgdata:
