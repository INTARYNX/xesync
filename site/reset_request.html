<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — XEsync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="canonical" href="https://xesync.intarynx.com/reset_request.html">
</head>
<body class="auth">

    <a href="login.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back to login</a>

    <div class="card reveal">
        <div class="brand"><span class="xe">XE</span><span class="sync">sync</span></div>
        <div class="brand-sub">Reset your password</div>

        <div class="help-text">
            Enter the email address associated with your account. We'll send you a link to set a new password.
        </div>

        <form id="resetForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Send reset link</button>
        </form>

        <div class="msg" id="msg" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script src="config.js"></script>
    <script>
        function handleSubmit(e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var btn = document.getElementById('submitBtn');
            msg.style.display = 'none';

            var email = document.getElementById('email').value.trim();
            if (!email) return;

            btn.disabled = true;
            btn.textContent = 'Sending…';

            fetch(XESYNC_CONFIG.apiBaseUrl + '/rpc/request_password_reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(function(r) { return r.json(); })
            .then(function(arr) {
                btn.disabled = false;
                btn.textContent = 'Send reset link';
                var data = Array.isArray(arr) ? arr[0] : arr;
                if (data && data.status === 'success') {
                    showMsg('If an account exists for that address, a reset link has been sent. Check your inbox.', 'success');
                } else {
                    showMsg((data && data.error) || 'Request failed.', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Send reset link';
                showMsg('Network error: ' + err.message, 'error');
            });
        }

        function showMsg(text, type) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
            el.style.display = 'block';
        }
    </script>
    <script src="site.js"></script>
</body>
</html>
