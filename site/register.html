<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — XEsync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="canonical" href="https://xesync.intarynx.com/register.html">
</head>
<body class="auth">

    <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back</a>

    <div class="card reveal">
        <div class="brand"><span class="xe">XE</span><span class="sync">sync</span></div>
        <div class="brand-sub">Create your account</div>

        <div class="error" id="error" aria-live="polite" aria-atomic="true"></div>
        <div class="success" id="success" aria-live="polite" aria-atomic="true">
          <strong>Check your inbox</strong><br><br>
          We just sent a verification email. Click the link inside to activate your account, then sign in.
        </div>

        <form id="registerForm" onsubmit="handleSubmit(event)">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="your_username" autocomplete="username" required>
                <div class="hint">Used to log in from the app. No spaces.</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="divider"></div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required oninput="checkStrength(this.value)">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="hint" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">Create Account</button>

            <div class="terms">
                By creating an account you agree to our <a href="confidentiality.html">Privacy Policy</a>.
            </div>
        </form>

        <div class="login-link">Already have an account? <a href="login.html">Log in</a></div>
    </div>

    <div class="auth-footer">
        <a href="confidentiality.html">Privacy Policy</a>
    </div>

    <script src="config.js"></script>
    <script>
        function checkStrength(pw) {
            var fill = document.getElementById('strengthFill');
            var label = document.getElementById('strengthLabel');
            var score = 0;
            if (pw.length >= 8) score++;
            if (pw.length >= 12) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^a-zA-Z0-9]/.test(pw)) score++;
            var pct = ['0%','30%','55%','80%','100%'][score];
            var colors = ['','#ff4444','#ffaa00','#00cc88','#00d4ff'];
            var labels = ['','Weak','Fair','Good','Strong'];
            fill.style.width = pct;
            fill.style.background = colors[score] || '';
            label.textContent = score > 0 ? labels[score] : '';
        }

        function handleSubmit(e) {
            e.preventDefault();
            var error = document.getElementById('error');
            var success = document.getElementById('success');
            var btn = document.getElementById('submitBtn');
            error.style.display = 'none';

            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;

            if (/\s/.test(username))   { showError('Username cannot contain spaces.'); return; }
            if (username.length < 3)   { showError('Username must be at least 3 characters.'); return; }
            if (password.length < 8)   { showError('Password must be at least 8 characters.'); return; }
            if (password !== confirm)  { showError('Passwords do not match.'); return; }

            btn.disabled = true;
            btn.textContent = 'Creating account…';

            fetch(XESYNC_CONFIG.apiBaseUrl + '/rpc/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, email: email, password: password })
            })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (arr) {
                var data = Array.isArray(arr) ? arr[0] : arr;
                if (data && data.status === 'success') {
                    document.getElementById('registerForm').style.display = 'none';
                    success.style.display = 'block';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    showError((data && data.error) || 'Registration failed.');
                }
            })
            .catch(function (err) {
                btn.disabled = false;
                btn.textContent = 'Create Account';
                showError('Network error: ' + err.message);
            });
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
    <script src="site.js"></script>
</body>
</html>
