<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — XEsync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
</head>
<body class="auth">

    <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back</a>

    <div class="card reveal">
        <div class="brand"><span class="xe">XE</span><span class="sync">sync</span></div>
        <div class="brand-sub">Sign in to your account</div>

        <div class="error" id="error" aria-live="polite" aria-atomic="true"></div>

        <form id="loginForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="your_username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Sign In</button>
        </form>

        <div class="register-link">No account yet? <a href="register.html">Create one</a></div>
        <div class="register-link" style="margin-top: 12px;"><a href="reset_request.html">Forgot password?</a></div>
    </div>

    <div class="auth-footer">
        <a href="confidentiality.html">Privacy Policy</a>
    </div>

    <script src="config.js"></script>
    <script>
        function handleSubmit(e) {
            e.preventDefault();
            var error = document.getElementById('error');
            var btn = document.getElementById('submitBtn');
            error.style.display = 'none';

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            if (!username || !password) { showError('Please fill in all fields.'); return; }

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            fetch(XESYNC_CONFIG.apiBaseUrl + '/rpc/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(arr) {
                var data = Array.isArray(arr) ? arr[0] : arr;
                if (data && data.status === 'success' && data.token) {
                    localStorage.setItem('xesync_token', data.token);
                    window.location.href = 'home.html';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    showError((data && data.error) || 'Invalid username or password.');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                showError('Login failed: ' + err.message);
            });
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
    <script src="site.js"></script>
</body>
</html>
