<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email — XEsync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
</head>
<body class="auth">
  <a href="login.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back</a>

  <div class="card reveal">
    <div class="brand"><span class="xe">XE</span><span class="sync">sync</span></div>
    <div class="verify-icon verify-spin" id="icon">⏳</div>
    <div class="verify-title" id="title">Verifying…</div>
    <div class="verify-msg"  id="msg" aria-live="polite" aria-atomic="true">Please wait while we confirm your email.</div>
    <a href="login.html" class="btn-inline" id="cta" style="display:none;">Sign in</a>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      function qp(name) {
        var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      }

      function setUI(state, title, msg) {
        var icon = document.getElementById('icon');
        var t    = document.getElementById('title');
        var m    = document.getElementById('msg');
        var cta  = document.getElementById('cta');
        if (state === 'ok')  { icon.textContent = '✓'; icon.className = 'verify-icon verify-ok';  cta.style.display = 'inline-block'; }
        if (state === 'err') { icon.textContent = '✕'; icon.className = 'verify-icon verify-err'; cta.style.display = 'none'; }
        if (state === 'spin') { icon.textContent = '⏳'; icon.className = 'verify-icon verify-spin'; cta.style.display = 'none'; }
        t.textContent = title;
        m.textContent = msg;
      }

      var token = qp('token');
      if (!token) {
        setUI('err', 'Invalid link', 'No verification token provided.');
        return;
      }

      fetch(XESYNC_CONFIG.apiBaseUrl + '/rpc/verify_email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (arr) {
        var data = Array.isArray(arr) ? arr[0] : arr;
        if (data && data.status === 'success') {
          setUI('ok', 'Email verified', 'Welcome, ' + (data.username || 'rower') + '! You can now sign in.');
        } else {
          setUI('err', 'Verification failed', (data && data.error) || 'Unknown error.');
        }
      })
      .catch(function (err) {
        setUI('err', 'Verification failed', err.message);
      });
    })();
  </script>
  <script src="site.js"></script>
</body>
</html>
