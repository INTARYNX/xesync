<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — XEsync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
</head>
<body class="auth">

    <a href="login.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back</a>

    <div class="card reveal">
        <div class="brand"><span class="xe">XE</span><span class="sync">sync</span></div>
        <div class="brand-sub">Set a new password</div>

        <div id="form-block">
            <div class="help-text">Choose a new password (at least 8 characters).</div>

            <form id="resetForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password" required minlength="8">
                </div>
                <button type="submit" class="btn" id="submitBtn">Set new password</button>
            </form>
        </div>

        <div class="msg" id="msg" aria-live="polite" aria-atomic="true"></div>
        <a href="login.html" class="footer-link" id="loginLink" style="display:none;">Go to login</a>
    </div>

    <script src="config.js"></script>
    <script>
        function getTokenFromUrl() {
            var m = window.location.search.match(/[?&]token=([^&]*)/);
            return m ? decodeURIComponent(m[1]) : null;
        }

        var token = getTokenFromUrl();
        if (!token) {
            document.getElementById('form-block').style.display = 'none';
            showMsg('Missing or invalid reset link.', 'error');
        }

        function handleSubmit(e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var btn = document.getElementById('submitBtn');
            msg.style.display = 'none';

            var pw  = document.getElementById('password').value;
            var pw2 = document.getElementById('confirm').value;

            if (pw.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
            if (pw !== pw2)    { showMsg('Passwords do not match.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Updating…';

            fetch(XESYNC_CONFIG.apiBaseUrl + '/rpc/reset_password_with_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, new_password: pw })
            })
            .then(function(r) { return r.json(); })
            .then(function(arr) {
                var data = Array.isArray(arr) ? arr[0] : arr;
                if (data && data.status === 'success') {
                    document.getElementById('form-block').style.display = 'none';
                    showMsg('Password updated. You can now log in with your new password.', 'success');
                    document.getElementById('loginLink').style.display = 'block';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Set new password';
                    showMsg((data && data.error) || 'Reset failed.', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Set new password';
                showMsg('Network error: ' + err.message, 'error');
            });
        }

        function showMsg(text, type) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
            el.style.display = 'block';
        }
    </script>
    <script src="site.js"></script>
</body>
</html>
